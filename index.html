<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>數獨遊戲</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h1>數獨遊戲 Sudoku</h1>
                <button id="themeToggleBtn" class="btn btn-secondary">🌙 深色</button>
            </div>
            <div class="info">
                <div class="stat">
                    <span class="label">難度:</span>
                    <span id="difficulty">簡單</span>
                </div>
                <div class="stat">
                    <span class="label">用時:</span>
                    <span id="timer">0:00</span>
                </div>
            </div>
        </div>

        <div class="controls">
            <button id="newGameBtn" class="btn btn-primary">新遊戲</button>
            <button id="checkBtn" class="btn btn-secondary">檢查</button>
            <button id="hintBtn" class="btn btn-secondary">提示</button>
            <button id="resetBtn" class="btn btn-secondary">重置</button>
            <button id="ruleBtn" class="btn btn-secondary">說明</button>
            <button id="statsBtn" class="btn btn-secondary">📊 戰績</button>
        </div>

        <div class="difficulty-selector">
            <label>選擇難度:</label>
            <select id="difficultySelect">
                <option value="easy">簡單 (30個數字)</option>
                <option value="medium" selected>普通 (25個數字)</option>
                <option value="hard">困難 (20個數字)</option>
                <option value="expert">專家 (15個數字)</option>
            </select>
        </div>

        <div class="board-container">
            <div id="sudokuBoard" class="sudoku-board"></div>
        </div>

        <div class="numpad" id="numpad">
            <div style="width: 100%; text-align: center; margin-bottom: 10px;">
             <button id="noteToggleBtn" class="btn btn-secondary">✏️ 筆記模式: 關</button>
         </div>
            <button class="num-btn">1</button>
            <button class="num-btn">2</button>
            <button class="num-btn">3</button>
            <button class="num-btn">4</button>
            <button class="num-btn">5</button>
            <button class="num-btn">6</button>
            <button class="num-btn">7</button>
            <button class="num-btn">8</button>
            <button class="num-btn">9</button>
            <button class="num-btn action-btn" id="numpadClear">清除</button>
        </div>

        <div id="message" class="message"></div>
        
        </div>

    <div id="ruleModal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2>📖 遊戲說明與操作教學</h2>
            <br>
            <p><strong>【遊戲規則】</strong><br>數獨是一個邏輯益智遊戲。填入 1-9 的數字，使每行、每列和每個 3×3 方框都包含 1-9 各一次。</p>
            <br>
            <p><strong>【操作方式】</strong><br>
            1. 點選畫面上的空格。<br>
            2. 使用實體鍵盤或畫面下方的<strong>虛擬數字鍵盤</strong>輸入。<br>
            3. 若遇到卡關，可點擊「提示」按鈕獲得幫助。<br>
            4. 完成後點擊「檢查」確認是否通關。</p>
        </div>
    </div>

    <script src="sudoku.js?v=1.0.0"></script>
<div id="statsModal" class="modal">
     <div class="modal-content">
         <span class="close-stats-btn close-btn">&times;</span>
         <h2>📊 歷史最佳戰績 (最快通關)</h2>
         <br>
         <div style="font-size: 18px; line-height: 2;">
             <p>🟢 簡單：<span id="stat-easy" style="font-weight: bold; color: #667eea;">無紀錄</span></p>
             <p>🟡 普通：<span id="stat-medium" style="font-weight: bold; color: #667eea;">無紀錄</span></p>
             <p>🟠 困難：<span id="stat-hard" style="font-weight: bold; color: #667eea;">無紀錄</span></p>
             <p>🔴 專家：<span id="stat-expert" style="font-weight: bold; color: #667eea;">無紀錄</span></p>
         </div>
     </div>
 </div>
</body>
</html>
